<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- 阴影的四种写法，看 Qt 支持到哪一步 -->
  <defs>
    <!-- A：模糊 SourceAlpha，偏移，再和原图合并 -->
    <filter id="a" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offset"/>
      <feMerge><feMergeNode in="offset"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- B：只偏移 -->
    <filter id="b" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset dx="8" dy="8"/>
    </filter>
    <!-- C：用纯色填充，再和 SourceAlpha 合成 -->
    <filter id="c" x="-30%" y="-30%" width="160%" height="160%">
      <feFlood flood-color="#dc2626" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>
    <!-- D 用的模糊 -->
    <filter id="d" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="80" height="50" rx="10" fill="#ffffff" stroke="#d9dce1" filter="url(#a)"/>
  <rect x="140" y="20" width="80" height="50" rx="10" fill="#2563eb" filter="url(#b)"/>
  <rect x="20" y="140" width="80" height="50" rx="10" fill="#2563eb" filter="url(#c)"/>
  <!-- D：不用合并。先画一个模糊的深色形状当阴影，再在上面画清晰的形状 -->
  <rect x="140" y="144" width="80" height="50" rx="10" fill="#000000" fill-opacity="0.35" filter="url(#d)"/>
  <rect x="140" y="140" width="80" height="50" rx="10" fill="#ffffff" stroke="#d9dce1"/>
</svg>
