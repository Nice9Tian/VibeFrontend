<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <!-- 裁剪、遮罩、用 style 元素和类名写样式、重复使用图形 -->
  <style>
    .primary { fill: #2563eb; }
    .outline { fill: none; stroke: #dc2626; stroke-width: 3; }
  </style>
  <defs>
    <clipPath id="clip"><circle cx="50" cy="60" r="34"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="fade"><rect x="100" y="20" width="60" height="80" fill="url(#g)"/></mask>
    <g id="star"><path d="M0 -14 L4 -4 L14 -4 L6 3 L9 13 L0 7 L-9 13 L-6 3 L-14 -4 L-4 -4 Z"/></g>
  </defs>
  <rect x="10" y="20" width="80" height="80" class="primary" clip-path="url(#clip)"/>
  <rect x="100" y="20" width="60" height="80" class="primary" mask="url(#fade)"/>
  <use href="#star" x="190" y="45" fill="#f0a800"/>
  <use href="#star" x="210" y="85" class="outline"/>
</svg>
