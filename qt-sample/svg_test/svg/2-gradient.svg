<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <!-- 线性渐变和径向渐变 -->
  <defs>
    <linearGradient id="lin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="rad" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="0.6" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#f0a800"/>
    </radialGradient>
  </defs>
  <rect x="10" y="20" width="110" height="80" rx="14" fill="url(#lin)"/>
  <circle cx="180" cy="60" r="42" fill="url(#rad)"/>
</svg>
